[package]
name = "ppt"
version = "0.1.0"
edition = "2021"
description = "Offline-first, Prezi-like zooming presentation engine in Rust with a 100-theme procedural palette system and SQLite/ZIP persistence"
repository = "https://github.com/festomanolo/ppt.git"
license = "MIT"

[lib]
name = "ppt"
path = "src/lib.rs"

[[bin]]
name = "ppt"
path = "src/main.rs"

[dependencies]
axum = "0.7.9"
base64 = "0.22"
rusqlite = "0.37.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "net", "fs", "sync"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
