<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Prezi-RS Studio</title>
<link rel="stylesheet" href="/app.css">
</head>
<body data-mode="edit" data-chrome="dark">
<div id="app">
  <main id="stage" aria-label="Presentation canvas" tabindex="-1">
    <div id="backdrop" aria-hidden="true"></div>
    <div id="world">
      <svg id="path-layer" aria-hidden="true"><path id="path-line"></path></svg>
      <div id="frames-layer"></div>
      <div id="elements-layer"></div>
    </div>
    <div id="overlay" aria-hidden="true">
      <div id="labels"></div>
      <div id="guides"></div>
      <div id="selection"></div>
      <div id="marquee" hidden></div>
    </div>
    <div id="empty-state" class="chrome" hidden>
      <h2>An empty canvas</h2>
      <p>Draw a frame to hold your first idea, or paste an outline and let the layout build itself.</p>
      <div class="row">
        <button class="btn" data-cmd="tool-frame"><i data-icon="frame-corners"></i>Draw a frame</button>
        <button class="btn btn-primary" data-cmd="outline"><i data-icon="magic-wand"></i>From outline</button>
      </div>
    </div>
  </main>

  <header id="topbar">
    <div class="island" id="island-deck">
      <button class="deck-btn" id="btn-decks" aria-haspopup="menu" data-tip="Decks">
        <span class="mark" aria-hidden="true"><span></span></span>
        <i data-icon="caret-down" class="caret"></i>
      </button>
      <input id="deck-title" aria-label="Deck name" spellcheck="false" autocomplete="off">
      <span id="save-state" class="save-state" role="status" aria-live="polite">Saved</span>
    </div>
    <div class="island" id="island-actions">
      <button class="icon-btn" data-cmd="undo" aria-label="Undo" data-tip="Undo" data-kbd="⌘Z"><i data-icon="arrow-counter-clockwise"></i></button>
      <button class="icon-btn" data-cmd="redo" aria-label="Redo" data-tip="Redo" data-kbd="⇧⌘Z"><i data-icon="arrow-clockwise"></i></button>
      <span class="sep"></span>
      <button class="icon-btn" data-cmd="palette" aria-label="Command menu" data-tip="Commands" data-kbd="⌘K"><i data-icon="command"></i></button>
      <button class="btn btn-ghost" id="btn-theme" aria-haspopup="dialog"><span class="theme-dot" aria-hidden="true"></span><span class="hide-sm">Theme</span></button>
      <button class="btn btn-ghost" id="btn-export" aria-haspopup="menu"><i data-icon="download-simple"></i><span class="hide-sm">Export</span></button>
      <button class="btn btn-primary" data-cmd="present" data-tip="Present" data-kbd="⌘↵"><i data-icon="play"></i><span>Present</span></button>
    </div>
  </header>

  <aside id="path-rail" class="panel" aria-label="Presentation path">
    <div class="rail-head">
      <div class="rail-title"><i data-icon="path"></i><span>Path</span><span id="path-count" class="count">0</span></div>
      <div class="rail-actions">
        <button class="icon-btn sm" data-cmd="toggle-path-line" aria-label="Show path on canvas" data-tip="Show path on canvas"><i data-icon="eye"></i></button>
        <button class="icon-btn sm" data-cmd="add-step" aria-label="Add step" data-tip="Add selection or current view" data-kbd="⇧A"><i data-icon="plus"></i></button>
        <button class="icon-btn sm" data-cmd="toggle-rail" aria-label="Collapse path" data-tip="Collapse"><i data-icon="caret-left"></i></button>
      </div>
    </div>
    <ol id="path-list"></ol>
    <div class="rail-foot">
      <button class="btn btn-block" data-cmd="present-here"><i data-icon="monitor-play"></i>Present from step</button>
    </div>
  </aside>
  <button id="rail-open" class="panel icon-btn" data-cmd="toggle-rail" aria-label="Show path" data-tip="Show path" hidden><i data-icon="path"></i></button>

  <nav id="dock" class="panel" aria-label="Tools">
    <button class="tool" data-tool="select" aria-label="Select" data-tip="Select" data-kbd="V"><i data-icon="cursor"></i></button>
    <button class="tool" data-tool="hand" aria-label="Pan" data-tip="Pan" data-kbd="H"><i data-icon="hand"></i></button>
    <span class="sep"></span>
    <button class="tool" data-tool="frame" aria-label="Frame" data-tip="Frame" data-kbd="F"><i data-icon="frame-corners"></i></button>
    <button class="tool" data-tool="text" aria-label="Text" data-tip="Text" data-kbd="T"><i data-icon="text-t"></i></button>
    <button class="tool tool-split" data-tool="shape" aria-label="Shape" data-tip="Shape" data-kbd="S"><i data-icon="shapes" id="shape-tool-icon"></i><span class="split-caret" id="shape-caret" aria-label="Choose shape"><i data-icon="caret-up"></i></span></button>
    <button class="tool" data-cmd="image" aria-label="Image" data-tip="Image" data-kbd="I"><i data-icon="image"></i></button>
    <span class="sep"></span>
    <button class="tool tool-magic" data-cmd="outline" aria-label="Build from outline" data-tip="Build from outline" data-kbd="⌘O"><i data-icon="magic-wand"></i></button>
  </nav>

  <div id="nav-cluster">
    <div id="minimap-wrap" class="panel">
      <canvas id="minimap" width="220" height="132" aria-label="Minimap"></canvas>
    </div>
    <div id="zoombar" class="panel">
      <button class="icon-btn sm" data-cmd="zoom-out" aria-label="Zoom out" data-tip="Zoom out" data-kbd="⌘-"><i data-icon="minus"></i></button>
      <button class="zoom-pct" id="zoom-pct" data-cmd="zoom-100" data-tip="Reset to 100%" data-kbd="0">100%</button>
      <button class="icon-btn sm" data-cmd="zoom-in" aria-label="Zoom in" data-tip="Zoom in" data-kbd="⌘+"><i data-icon="plus"></i></button>
      <span class="sep"></span>
      <button class="icon-btn sm" data-cmd="fit" aria-label="Fit everything" data-tip="Fit everything" data-kbd="⇧1"><i data-icon="corners-out"></i></button>
      <button class="icon-btn sm" data-cmd="toggle-minimap" aria-label="Toggle minimap" data-tip="Minimap" data-kbd="M"><i data-icon="map-trifold"></i></button>
    </div>
  </div>

  <aside id="inspector" class="panel" aria-label="Inspector" hidden></aside>

  <!-- Present mode -->
  <div id="present-hud" class="panel" role="toolbar" aria-label="Presentation controls">
    <button class="icon-btn" data-cmd="prev" aria-label="Previous" data-tip="Previous" data-kbd="←"><i data-icon="caret-left"></i></button>
    <span id="hud-count" class="hud-count">1 / 1</span>
    <button class="icon-btn" data-cmd="next" aria-label="Next" data-tip="Next" data-kbd="→"><i data-icon="caret-right"></i></button>
    <span class="sep"></span>
    <button class="icon-btn" data-cmd="overview" aria-label="Overview" data-tip="Overview" data-kbd="O"><i data-icon="squares-four"></i></button>
    <button class="icon-btn" data-cmd="laser" aria-label="Laser pointer" data-tip="Laser" data-kbd="L"><i data-icon="cursor-click"></i></button>
    <button class="icon-btn" data-cmd="presenter" id="hud-presenter" aria-label="Presenter view" data-tip="Presenter view" data-kbd="P"><i data-icon="monitor-play"></i></button>
    <button class="icon-btn" data-cmd="fullscreen" aria-label="Full screen" data-tip="Full screen" data-kbd="⇧F"><i data-icon="arrows-out-cardinal"></i></button>
    <button class="icon-btn" data-cmd="exit-present" id="hud-exit" aria-label="Exit" data-tip="Exit" data-kbd="Esc"><i data-icon="x"></i></button>
  </div>
  <div id="progress" aria-hidden="true"><i></i></div>
  <div id="laser" aria-hidden="true"></div>
  <div id="blackout" aria-hidden="true"></div>

  <div id="presenter" hidden></div>

  <div id="popover-layer"></div>
  <div id="toast-layer" role="status" aria-live="polite"></div>
  <div id="tooltip" role="tooltip" hidden></div>
</div>
<input type="file" id="file-image" accept="image/*" hidden>
<input type="file" id="file-import" accept=".prezi-rs,.zpz,.json,application/zip" hidden>
<!--EMBED-->
<script src="/js/icons.js"></script>
<script src="/js/engine.js"></script>
<script src="/js/editor.js"></script>
<script src="/js/outline.js"></script>
<script src="/js/present.js"></script>
<script src="/js/boot.js"></script>
</body>
</html>
